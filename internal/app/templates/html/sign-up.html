<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spendly — Create account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/globals.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'] } } } }</script>
</head>
<body class="bg-[#F9FAFB] min-h-screen flex items-center justify-center p-4 antialiased text-gray-900">

    <main class="w-full max-w-[420px] bg-white p-8 sm:p-10 border border-gray-200 rounded-2xl">
        <header class="mb-8">
            <div class="flex items-center gap-2.5 mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
                <h1 class="text-2xl font-bold tracking-tight">Spendly</h1>
            </div>
            <h2 class="text-lg font-semibold text-gray-900">Create your account</h2>
        </header>

        <form action="/api/signup" method="POST" class="space-y-5" data-signup-form>
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1.5">Username</label>
                <input type="text" id="username" name="username" autocomplete="username"
                    class="w-full px-4 py-2.5 text-sm rounded-lg border border-gray-200 focus:outline-none focus:border-gray-900 transition-colors"
                    placeholder="Choose a username">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
                <div class="relative">
                    <input type="password" id="password" name="password" autocomplete="new-password"
                        class="w-full px-4 py-2.5 pr-10 text-sm rounded-lg border border-gray-200 focus:outline-none focus:border-gray-900 transition-colors"
                        placeholder="Create a password">
                    <button type="button" id="toggle-pw" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none" aria-label="Toggle password">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
                <div class="mt-2 flex gap-1.5">
                    <div class="h-1 flex-1 rounded-full bg-gray-100" id="s1"></div>
                    <div class="h-1 flex-1 rounded-full bg-gray-100" id="s2"></div>
                    <div class="h-1 flex-1 rounded-full bg-gray-100" id="s3"></div>
                </div>
                <p class="text-[11px] text-gray-400 mt-1 font-medium uppercase tracking-wide" id="strength-label"></p>
            </div>

            <div>
                <label for="confirm" class="block text-sm font-medium text-gray-700 mb-1.5">Confirm password</label>
                <input type="password" id="confirm" autocomplete="new-password"
                    class="w-full px-4 py-2.5 text-sm rounded-lg border border-gray-200 focus:outline-none focus:border-gray-900 transition-colors"
                    placeholder="Confirm your password">
            </div>

            <p class="text-sm text-red-500 font-medium hidden" id="signup-error"></p>

            <button type="submit" class="w-full bg-gray-900 hover:bg-black text-white text-sm font-medium py-3 rounded-lg transition-colors focus:outline-none">
                Create account
            </button>
        </form>

        <div class="mt-8 text-center text-sm text-gray-500">
            Already have an account? <a href="/login" class="text-gray-900 font-medium hover:underline">Sign in</a>
        </div>
    </main>

    <script>
        document.getElementById('toggle-pw').addEventListener('click', function() {
            const pw = document.getElementById('password');
            pw.type = pw.type === 'password' ? 'text' : 'password';
        });

        const bars = ['s1','s2','s3'].map(id => document.getElementById(id));
        const strengthLabel = document.getElementById('strength-label');
        const barColors = ['bg-red-400','bg-yellow-400','bg-green-500'];
        const strengthLabels = ['Weak','Medium','Strong'];

        document.getElementById('password').addEventListener('input', function() {
            const v = this.value;
            let score = 0;
            if (v.length >= 8) score++;
            if (/[A-Z]/.test(v) || /[0-9]/.test(v)) score++;
            if (/[^A-Za-z0-9]/.test(v) && v.length >= 6) score++;
            bars.forEach((b, i) => {
                b.className = 'h-1 flex-1 rounded-full ' + (i < score ? barColors[score - 1] : 'bg-gray-100');
            });
            strengthLabel.textContent = v.length ? (strengthLabels[score - 1] || '') : '';
        });

        const form = document.querySelector('[data-signup-form]');
        const errEl = document.getElementById('signup-error');
        form.addEventListener('submit', async e => {
            e.preventDefault();
            errEl.classList.add('hidden');
            if (document.getElementById('password').value !== document.getElementById('confirm').value) {
                errEl.textContent = 'Passwords do not match.';
                errEl.classList.remove('hidden');
                return;
            }
            const fd = new FormData(form);
            const res = await fetch(form.action, { method: 'POST', body: fd });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) { errEl.textContent = data.error || 'Signup failed.'; errEl.classList.remove('hidden'); return; }
            window.location.href = data.redirect || '/dashboard';
        });
    </script>
</body>
</html>
