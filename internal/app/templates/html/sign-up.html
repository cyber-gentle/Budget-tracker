<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spendly — Create account</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/imgs/favicon.svg">
    <link rel="alternate icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/globals.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <script>
            (function () {
                try {
                    const storedTheme = localStorage.getItem('spendly-theme');
                    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    if (storedTheme === 'dark' || (!storedTheme && prefersDark)) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                } catch (e) { }
            })();
    </script>
</head>

<body
    class="bg-[#F9FAFB] dark:bg-slate-950 min-h-screen flex items-center justify-center p-4 antialiased text-gray-900 dark:text-slate-100 transition-colors">

    <main
        class="w-full max-w-[420px] bg-white dark:bg-slate-900 p-8 sm:p-10 border border-gray-200 dark:border-slate-800 rounded-2xl shadow-sm transition-colors">
        <header class="mb-8 flex items-start justify-between">
            <div>
                <div class="flex items-center gap-2.5 mb-6">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                        class="text-gray-900 dark:text-emerald-500">
                        <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4" />
                        <path d="M3 5v14a2 2 0 0 0 2 2h16v-5" />
                        <path d="M18 12a2 2 0 0 0 0 4h4v-4Z" />
                    </svg>
                    <h1 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white">Spendly</h1>
                </div>
                <h2 class="text-lg font-semibold text-gray-900 dark:text-slate-200">Create your account</h2>
            </div>
            <button id="theme-toggle-btn" type="button" aria-label="Toggle theme"
                class="p-2 text-gray-400 hover:text-gray-900 dark:text-slate-400 dark:hover:text-white rounded-lg hover:bg-gray-100 dark:hover:bg-slate-800 transition-colors">
                <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
                    </path>
                </svg>
                <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 3v1m0 16v1m9-9h-1M4 9h-1m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
                    </path>
                </svg>
            </button>
        </header>

        <form action="/api/signup" method="POST" class="space-y-4" data-signup-form>
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1.5">Full
                    name</label>
                <input type="text" id="name" name="name" autocomplete="name"
                    class="w-full px-4 py-2.5 text-sm rounded-lg border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-gray-900 dark:text-slate-100 focus:outline-none focus:border-gray-900 dark:focus:border-slate-500 transition-colors placeholder:text-gray-400 dark:placeholder:text-slate-500"
                    placeholder="e.g. John Doe">
            </div>

            <div>
                <label for="username"
                    class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1.5">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required
                    class="w-full px-4 py-2.5 text-sm rounded-lg border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-gray-900 dark:text-slate-100 focus:outline-none focus:border-gray-900 dark:focus:border-slate-500 transition-colors placeholder:text-gray-400 dark:placeholder:text-slate-500"
                    placeholder="Choose a username">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1.5">Email
                    address</label>
                <input type="email" id="email" name="email" autocomplete="email" required
                    class="w-full px-4 py-2.5 text-sm rounded-lg border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-gray-900 dark:text-slate-100 focus:outline-none focus:border-gray-900 dark:focus:border-slate-500 transition-colors placeholder:text-gray-400 dark:placeholder:text-slate-500"
                    placeholder="you@example.com">
            </div>

            <div>
                <label for="password"
                    class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1.5">Password</label>
                <div class="relative">
                    <input type="password" id="password" name="password" autocomplete="new-password"
                        class="w-full px-4 py-2.5 pr-10 text-sm rounded-lg border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-gray-900 dark:text-slate-100 focus:outline-none focus:border-gray-900 dark:focus:border-slate-500 transition-colors placeholder:text-gray-400 dark:placeholder:text-slate-500"
                        placeholder="Create a password">
                    <button type="button" id="toggle-pw"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-slate-200 focus:outline-none cursor-pointer"
                        aria-label="Toggle password">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
                <div class="mt-2 flex gap-1.5">
                    <div class="h-1 flex-1 rounded-full bg-gray-100 dark:bg-slate-800" id="s1"></div>
                    <div class="h-1 flex-1 rounded-full bg-gray-100 dark:bg-slate-800" id="s2"></div>
                    <div class="h-1 flex-1 rounded-full bg-gray-100 dark:bg-slate-800" id="s3"></div>
                </div>
                <p class="text-[11px] text-gray-400 dark:text-slate-500 mt-1 font-medium uppercase tracking-wide"
                    id="strength-label"></p>
            </div>

            <div>
                <label for="confirm" class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1.5">Confirm
                    password</label>
                <div class="relative">
                    <input type="password" id="confirm" autocomplete="new-password"
                        class="w-full px-4 py-2.5 pr-10 text-sm rounded-lg border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-gray-900 dark:text-slate-100 focus:outline-none focus:border-gray-900 dark:focus:border-slate-500 transition-colors placeholder:text-gray-400 dark:placeholder:text-slate-500"
                        placeholder="Confirm your password">
                    <button type="button" id="toggle-confirm-pw"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-slate-200 focus:outline-none cursor-pointer"
                        aria-label="Toggle confirm password">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
            </div>

            <p class="text-sm text-red-500 dark:text-red-400 font-medium hidden" id="signup-error"></p>

            <button type="submit"
                class="w-full bg-gray-900 dark:bg-emerald-600 hover:bg-black dark:hover:bg-emerald-500 text-white text-sm font-medium py-3 rounded-lg transition-colors focus:outline-none cursor-pointer">
                Create account
            </button>
        </form>

        <div class="mt-8 text-center text-sm text-gray-500 dark:text-slate-400">
            Already have an account? <a href="/login"
                class="text-gray-900 dark:text-white font-medium hover:underline">Sign in</a>
        </div>
    </main>

    <script>
        function setupPasswordToggle(buttonId, inputId) {
            const btn = document.getElementById(buttonId);
            const input = document.getElementById(inputId);
            if (!btn || !input) return;
            btn.addEventListener('click', function () {
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                btn.innerHTML = isPassword
                    ? `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>`
                    : `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>`;
                if (isPassword) {
                    btn.classList.add('text-gray-900', 'dark:text-slate-100');
                    btn.classList.remove('text-gray-400');
                } else {
                    btn.classList.remove('text-gray-900', 'dark:text-slate-100');
                    btn.classList.add('text-gray-400');
                }
            });
        }
        setupPasswordToggle('toggle-pw', 'password');
        setupPasswordToggle('toggle-confirm-pw', 'confirm');

        const bars = ['s1', 's2', 's3'].map(id => document.getElementById(id));
        const strengthLabel = document.getElementById('strength-label');
        const barColors = ['bg-red-400', 'bg-yellow-400', 'bg-green-500'];
        const strengthLabels = ['Weak', 'Medium', 'Strong'];

        document.getElementById('password').addEventListener('input', function () {
            const v = this.value;
            let score = 0;
            if (v.length >= 8) score++;
            if (/[A-Z]/.test(v) || /[0-9]/.test(v)) score++;
            if (/[^A-Za-z0-9]/.test(v) && v.length >= 6) score++;
            bars.forEach((b, i) => {
                b.className = 'h-1 flex-1 rounded-full ' + (i < score ? barColors[score - 1] : 'bg-gray-100');
            });
            strengthLabel.textContent = v.length ? (strengthLabels[score - 1] || '') : '';
        });

        const form = document.querySelector('[data-signup-form]');
        const errEl = document.getElementById('signup-error');
        form.addEventListener('submit', async e => {
            e.preventDefault();
            errEl.classList.add('hidden');
            if (document.getElementById('password').value !== document.getElementById('confirm').value) {
                errEl.textContent = 'Passwords do not match.';
                errEl.classList.remove('hidden');
                return;
            }
            const fd = new FormData(form);
            const res = await fetch(form.action, { method: 'POST', body: fd });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) { errEl.textContent = data.error || 'Signup failed.'; errEl.classList.remove('hidden'); return; }
            window.location.href = data.redirect || '/dashboard';
        });

        // Theme Toggle
        const themeBtn = document.getElementById('theme-toggle-btn');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        function updateToggleIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            if (isDark) {
                darkIcon?.classList.add('hidden');
                lightIcon?.classList.remove('hidden');
            } else {
                lightIcon?.classList.add('hidden');
                darkIcon?.classList.remove('hidden');
            }
        }

        updateToggleIcon();

        if (themeBtn) {
            themeBtn.addEventListener('click', () => {
                const isDark = document.documentElement.classList.contains('dark');
                if (isDark) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('spendly-theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('spendly-theme', 'dark');
                }
                updateToggleIcon();
            });
        }
    </script>
</body>

</html>
