<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spendly - Sign in</title>
    
    <!-- Load Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/globals.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        offwhite: '#F9FAFB',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-offwhite min-h-screen flex items-center justify-center p-4 antialiased text-gray-900">

    <!-- Main Card -->
    <main class="w-full max-w-[420px] bg-white sm:p-10 p-8 rounded-2xl shadow-[0_4px_24px_-8px_rgba(0,0,0,0.04)] border border-gray-100">
        
        <!-- Header -->
        <header class="mb-8">
            <div class="flex items-center gap-2.5 mb-1.5">
                <!-- Wallet Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-gray-900">
                    <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/>
                    <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/>
                    <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>
                </svg>
                <h1 class="text-2xl font-bold tracking-tight text-gray-900">Spendly</h1>
            </div>
            <p class="text-sm text-gray-500">Track every naira.</p>
        </header>

        <!-- Form -->
        <form action="#" method="POST" class="space-y-5" onsubmit="event.preventDefault();">
            
            <!-- Username Input -->
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1.5">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    value="johndoe"
                    class="w-full px-4 py-2.5 text-sm rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-100 focus:border-gray-400 transition-colors bg-transparent" 
                    placeholder="Enter your username">
            </div>

            <!-- Password Input with Error State -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
                <div class="relative">
                    <input 
                        type="password" 
                        id="password" 
                        value="mypassword123"
                        class="w-full px-4 py-2.5 text-sm rounded-lg border border-red-500 focus:outline-none focus:ring-2 focus:ring-red-100 focus:border-red-500 pr-10 transition-colors bg-transparent text-gray-900" 
                        placeholder="••••••••">
                    
                    <!-- Eye Toggle Button -->
                    <button 
                        type="button" 
                        id="togglePassword"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors focus:outline-none"
                        aria-label="Toggle password visibility">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye">
                            <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <!-- Inline Error Message -->
                <p class="text-sm text-red-500 mt-2 font-medium">Invalid username or password.</p>
            </div>

            <!-- Submit Button -->
            <div class="pt-2">
                <button 
                    type="submit" 
                    class="w-full bg-gray-900 hover:bg-black text-white text-sm font-medium py-3 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-900">
                    Sign in
                </button>
            </div>
        </form>

        <!-- Back Home -->
        <div class="mt-8 text-center">
            <p class="text-sm text-gray-500">
                <a href="./index.html" class="hover:text-gray-800 transition-colors" style="display: block;">Go Home</a>
            </p>
        </div>

        <!-- Footer Link -->
        <div class="mt-8 text-center">
            <p class="text-sm text-gray-500">
                <a href="./sign-up.html" class="hover:text-gray-800 transition-colors">No account? <span class="font-medium text-gray-900 hover:underline">Register</span></a>
            </p>
        </div>
        
    </main>

    <!-- Simple vanilla JS to make the eye toggle functional -->
    <script>
        const togglePassword = document.getElementById('togglePassword');
        const password = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            
            // Toggle opacity of the eye icon to indicate state
            if (type === 'text') {
                this.classList.add('text-gray-900');
                this.classList.remove('text-gray-400');
            } else {
                this.classList.add('text-gray-400');
                this.classList.remove('text-gray-900');
            }
        });
    </script>
</body>
</html>
