<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spendly - Sign in</title>
    
    <link rel="icon" type="image/svg+xml" href="/static/assets/imgs/favicon.svg">
    <link rel="alternate icon" href="/favicon.ico">

    <!-- Load Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/globals.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        offwhite: '#F9FAFB',
                    }
                }
            }
        }
    </script>
    <script>
        (function() {
            try {
                const storedTheme = localStorage.getItem('spendly-theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (storedTheme === 'dark' || (!storedTheme && prefersDark)) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch (e) {}
        })();
    </script>
</head>
<body class="bg-offwhite dark:bg-slate-950 min-h-screen flex items-center justify-center p-4 antialiased text-gray-900 dark:text-slate-100 transition-colors">

    <!-- Main Card -->
    <main class="w-full max-w-[420px] bg-white dark:bg-slate-900 sm:p-10 p-8 rounded-2xl shadow-[0_4px_24px_-8px_rgba(0,0,0,0.04)] border border-gray-100 dark:border-slate-800 transition-colors">
        
        <!-- Header -->
        <header class="mb-8 flex items-start justify-between">
            <div>
                <div class="flex items-center gap-2.5 mb-1.5">
                    <!-- Wallet Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-gray-900 dark:text-emerald-500">
                        <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/>
                        <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/>
                        <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>
                    </svg>
                    <h1 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white">Spendly</h1>
                </div>
                <p class="text-sm text-gray-500 dark:text-slate-400">Track every naira.</p>
            </div>
            <button id="theme-toggle-btn" type="button" aria-label="Toggle theme" class="p-2 text-gray-400 hover:text-gray-900 dark:text-slate-400 dark:hover:text-white rounded-lg hover:bg-gray-100 dark:hover:bg-slate-800 transition-colors">
                <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
                <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 9h-1m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
            </button>
        </header>

        <!-- Form -->
        <form action="/api/login" method="POST" class="space-y-5" data-login-form>
            
            <!-- Identifier (Email or Username) Input -->
            <div>
                <label for="identifier" class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1.5">Email or Username</label>
                <input 
                    type="text" 
                    id="identifier" 
                    name="identifier"
                    value=""
                    autocomplete="username"
                    required
                    class="w-full px-4 py-2.5 text-sm rounded-lg border border-gray-300 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-gray-100 dark:focus:ring-slate-800 focus:border-gray-400 dark:focus:border-slate-500 transition-colors bg-transparent dark:bg-slate-800 text-gray-900 dark:text-slate-100 placeholder:text-gray-400 dark:placeholder:text-slate-500" 
                    placeholder="Enter your email or username">
            </div>

            <!-- Password Input with Error State -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1.5">Password</label>
                <div class="relative">
                    <input 
                        type="password" 
                        id="password" 
                        name="password"
                        value=""
                        autocomplete="current-password"
                        class="w-full px-4 py-2.5 text-sm rounded-lg border border-gray-300 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-gray-100 dark:focus:ring-slate-800 focus:border-gray-400 dark:focus:border-slate-500 pr-10 transition-colors bg-transparent dark:bg-slate-800 text-gray-900 dark:text-slate-100 placeholder:text-gray-400 dark:placeholder:text-slate-500" 
                        placeholder="••••••••">
                    
                    <!-- Eye Toggle Button -->
                    <button 
                        type="button" 
                        id="togglePassword"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-slate-200 transition-colors focus:outline-none cursor-pointer"
                        aria-label="Toggle password visibility">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye">
                            <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <!-- Inline Error Message -->
                <p class="text-sm text-red-500 dark:text-red-400 mt-2 font-medium" id="login-error" style="display:none;">Invalid email/username or password.</p>
            </div>

            <!-- Submit Button -->
            <div class="pt-2">
                <button 
                    type="submit" 
                    class="w-full bg-gray-900 dark:bg-emerald-600 hover:bg-black dark:hover:bg-emerald-500 text-white text-sm font-medium py-3 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-900 cursor-pointer">
                    Sign in
                </button>
            </div>
        </form>


        <!-- Back Home -->
        <div class="mt-8 text-center">
            <p class="text-sm text-gray-500 dark:text-slate-400">
                <a href="/" class="hover:text-gray-800 dark:hover:text-slate-200 transition-colors" style="display: block;">Go Home</a>
            </p>
        </div>

        <!-- Footer Link -->
        <div class="mt-8 text-center">
            <p class="text-sm text-gray-500 dark:text-slate-400">
                <a href="/sign-up" class="hover:text-gray-800 dark:hover:text-slate-200 transition-colors">No account? <span class="font-medium text-gray-900 dark:text-white hover:underline">Register</span></a>
            </p>
        </div>
        
    </main>

    <!-- Simple vanilla JS to make the eye toggle functional -->
    <script>
        const togglePassword = document.getElementById('togglePassword');
        const password = document.getElementById('password');
        const errorEl = document.getElementById('login-error');

        togglePassword.addEventListener('click', function () {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);

            if (type === 'text') {
                this.classList.add('text-gray-900');
                this.classList.remove('text-gray-400');
            } else {
                this.classList.add('text-gray-400');
                this.classList.remove('text-gray-900');
            }
        });

        // AJAX submit so we can redirect cleanly and show API errors.
        const form = document.querySelector('[data-login-form]');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.style.display = 'none';

            const fd = new FormData(form);
            const res = await fetch(form.action, {
                method: 'POST',
                body: fd
            });

            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                errorEl.textContent = data.error || 'Login failed.';
                errorEl.style.display = 'block';
                return;
            }

            window.location.href = data.redirect || '/dashboard';
        });

        // Theme Toggle
        const themeBtn = document.getElementById('theme-toggle-btn');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        function updateToggleIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            if (isDark) {
                darkIcon?.classList.add('hidden');
                lightIcon?.classList.remove('hidden');
            } else {
                lightIcon?.classList.add('hidden');
                darkIcon?.classList.remove('hidden');
            }
        }

        updateToggleIcon();

        if (themeBtn) {
            themeBtn.addEventListener('click', () => {
                const isDark = document.documentElement.classList.contains('dark');
                if (isDark) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('spendly-theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('spendly-theme', 'dark');
                }
                updateToggleIcon();
            });
        }
    </script>

</body>
</html>
