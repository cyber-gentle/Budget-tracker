<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spendly — Create account</title>
    
    <!-- Load Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/globals.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-[#F9FAFB] min-h-screen flex items-center justify-center p-4 antialiased text-gray-900">

    <main class="w-full max-w-[420px] bg-white p-8 sm:p-10 border border-gray-200 rounded-2xl">
        
        <!-- Header -->
        <header class="mb-8">
            <div class="flex items-center gap-2.5 mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-gray-900">
                    <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/>
                    <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/>
                    <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>
                </svg>
                <h1 class="text-2xl font-bold tracking-tight text-gray-900">Spendly</h1>
            </div>
            <h2 class="text-lg font-semibold text-gray-900">Create your account</h2>
        </header>

        <!-- Form -->
        <form action="/api/signup" method="POST" class="space-y-5" data-signup-form>
            
            <!-- Username -->
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1.5">Username</label>
                <input type="text" id="username" name="username" class="w-full px-4 py-2.5 text-sm rounded-lg border border-gray-200 focus:outline-none focus:border-gray-900 transition-colors" placeholder="Choose a username" autocomplete="username">
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
                <input type="password" id="password" name="password" class="w-full px-4 py-2.5 text-sm rounded-lg border border-gray-200 focus:outline-none focus:border-gray-900 transition-colors" placeholder="Create a password" autocomplete="new-password">
                
                <!-- Strength Indicator -->
                <div class="mt-2 flex gap-1.5">
                    <div class="h-1 flex-1 rounded-full bg-green-500"></div>
                    <div class="h-1 flex-1 rounded-full bg-green-500"></div>
                    <div class="h-1 flex-1 rounded-full bg-gray-100"></div>
                </div>
                <p class="text-[11px] text-gray-400 mt-1.5 font-medium uppercase tracking-wide">Medium strength</p>
            </div>

            <!-- Confirm Password -->
            <div>
                <label for="confirm" class="block text-sm font-medium text-gray-700 mb-1.5">Confirm password</label>
                <input type="password" id="confirm" class="w-full px-4 py-2.5 text-sm rounded-lg border border-gray-200 focus:outline-none focus:border-gray-900 transition-colors" placeholder="Confirm your password" autocomplete="new-password">
            </div>

            <p class="text-sm text-red-500 mt-2 font-medium" id="signup-error" style="display:none;"></p>

            <!-- Submit -->
            <button type="submit" class="w-full bg-gray-900 hover:bg-black text-white text-sm font-medium py-3 rounded-lg transition-colors focus:outline-none">
                Create account
            </button>
        </form>


        <!-- Footer -->
        <div class="mt-8 text-center text-sm">
            <p class="text-gray-500">
                Already have an account? <a href="/login" class="text-gray-900 font-medium hover:underline">Sign in</a>
            </p>
        </div>
    </main>

    <script>
        const form = document.querySelector('[data-signup-form]');
        const passwordEl = document.getElementById('password');
        const confirmEl = document.getElementById('confirm');
        const errorEl = document.getElementById('signup-error');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.style.display = 'none';

            if (passwordEl.value !== confirmEl.value) {
                errorEl.textContent = 'Passwords do not match.';
                errorEl.style.display = 'block';
                return;
            }

            const fd = new FormData(form);
            const res = await fetch(form.action, { method: 'POST', body: fd });
            const data = await res.json().catch(() => ({}));

            if (!res.ok) {
                errorEl.textContent = data.error || 'Signup failed.';
                errorEl.style.display = 'block';
                return;
            }

            window.location.href = data.redirect || '/dashboard';
        });
    </script>
</body>
</html>
