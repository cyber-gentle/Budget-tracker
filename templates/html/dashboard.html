<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spendly — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/globals.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'] } } } }</script>
</head>
<body class="bg-[#F9FAFB] min-h-screen antialiased text-gray-900">

    <!-- Navbar -->
    <nav class="w-full border-b border-gray-200 bg-white sticky top-0 z-10">
        <div class="max-w-[680px] mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
                <span class="text-lg font-bold tracking-tight">Spendly</span>
            </a>
            <div class="flex items-center gap-4 text-sm">
                <span class="font-medium text-gray-900">{{.Username}}</span>
                <span class="text-gray-300">|</span>
                <a href="#" id="logout-link" class="text-gray-500 hover:text-gray-900 transition-colors">Sign out</a>
            </div>
        </div>
    </nav>

    <main class="max-w-[680px] mx-auto px-4 py-8 sm:py-10">

        <!-- Summary Cards -->
        <section class="grid grid-cols-3 gap-3 sm:gap-4 mb-8">
            <div class="bg-white border border-gray-200 rounded-xl p-4 sm:p-5">
                <p class="text-xs sm:text-sm font-medium text-gray-500 mb-1">Income</p>
                <p class="text-base sm:text-2xl font-semibold text-green-600 truncate" id="income-amount">{{.IncomeFmt}}</p>
            </div>
            <div class="bg-white border border-gray-200 rounded-xl p-4 sm:p-5">
                <p class="text-xs sm:text-sm font-medium text-gray-500 mb-1">Expenses</p>
                <p class="text-base sm:text-2xl font-semibold text-red-500 truncate" id="expense-amount">{{.ExpensesFmt}}</p>
            </div>
            <div class="bg-white border border-gray-200 rounded-xl p-4 sm:p-5">
                <p class="text-xs sm:text-sm font-medium text-gray-500 mb-1">Balance</p>
                <p class="text-base sm:text-2xl font-semibold text-gray-900 truncate" id="balance-amount">{{.BalanceFmt}}</p>
            </div>
        </section>

        <!-- Add Transaction -->
        <section class="bg-white border border-gray-200 rounded-xl p-5 sm:p-6 mb-8">
            <h2 class="text-sm font-semibold text-gray-900 mb-4">Add transaction</h2>
            <form id="add-tx-form" class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <select name="type" class="w-full px-3 py-2.5 text-sm bg-white border border-gray-200 rounded-lg focus:outline-none focus:border-gray-900 appearance-none">
                        <option value="expense">Expense</option>
                        <option value="income">Income</option>
                    </select>
                    <select name="category" class="w-full px-3 py-2.5 text-sm bg-white border border-gray-200 rounded-lg focus:outline-none focus:border-gray-900 appearance-none">
                        <option value="" disabled selected>Category…</option>
                        <option value="food">Food & Groceries</option>
                        <option value="transport">Transport</option>
                        <option value="housing">Housing & Utilities</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="salary">Salary</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="amount-input" name="amount" placeholder="Amount (₦)" inputmode="numeric" class="w-full px-3 py-2.5 text-sm bg-white border border-gray-200 rounded-lg focus:outline-none focus:border-gray-900">
                    <input type="text" name="note" placeholder="Note (optional)" class="w-full px-3 py-2.5 text-sm bg-white border border-gray-200 rounded-lg focus:outline-none focus:border-gray-900">
                </div>
                <p class="text-sm text-red-500 font-medium hidden" id="tx-error"></p>
                <button type="submit" class="w-full bg-gray-900 hover:bg-black text-white text-sm font-medium py-2.5 rounded-lg transition-colors">
                    Add transaction
                </button>
            </form>
        </section>

        <!-- Transaction List -->
        <section class="bg-white border border-gray-200 rounded-xl overflow-hidden">
            <!-- Header + Filter -->
            <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between gap-3">
                <h2 class="text-sm font-semibold text-gray-900 shrink-0">Recent Activity</h2>
                <select id="filter" class="text-xs px-2.5 py-1.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:border-gray-900 appearance-none">
                    <option value="all">All</option>
                    <option value="income">Income</option>
                    <option value="expense">Expenses</option>
                </select>
            </div>

            <!-- Loading -->
            <div id="tx-loading" class="py-10 text-center text-sm text-gray-400">Loading…</div>

            <!-- List -->
            <div class="divide-y divide-gray-100" id="tx-list" style="display:none"></div>

            <!-- Empty -->
            <div id="tx-empty" class="py-12 text-center hidden">
                <p class="text-sm text-gray-400">No transactions yet. Add your first one above!</p>
            </div>
        </section>

    </main>

    <!-- Edit Modal -->
    <div id="edit-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 hidden">
        <div class="bg-white rounded-2xl border border-gray-200 p-6 w-full max-w-sm mx-4 shadow-xl">
            <h3 class="text-sm font-semibold text-gray-900 mb-4">Edit transaction</h3>
            <form id="edit-tx-form" class="space-y-3">
                <input type="hidden" id="edit-id">
                <div class="grid grid-cols-2 gap-3">
                    <select id="edit-type" name="type" class="w-full px-3 py-2.5 text-sm bg-white border border-gray-200 rounded-lg focus:outline-none focus:border-gray-900 appearance-none">
                        <option value="expense">Expense</option>
                        <option value="income">Income</option>
                    </select>
                    <select id="edit-category" name="category" class="w-full px-3 py-2.5 text-sm bg-white border border-gray-200 rounded-lg focus:outline-none focus:border-gray-900 appearance-none">
                        <option value="food">Food & Groceries</option>
                        <option value="transport">Transport</option>
                        <option value="housing">Housing & Utilities</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="salary">Salary</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <input type="text" id="edit-amount" name="amount" placeholder="Amount (₦)" inputmode="numeric" class="w-full px-3 py-2.5 text-sm bg-white border border-gray-200 rounded-lg focus:outline-none focus:border-gray-900">
                <input type="text" id="edit-note" name="note" placeholder="Note" class="w-full px-3 py-2.5 text-sm bg-white border border-gray-200 rounded-lg focus:outline-none focus:border-gray-900">
                <p class="text-sm text-red-500 font-medium hidden" id="edit-error"></p>
                <div class="flex gap-3 pt-1">
                    <button type="button" id="edit-cancel" class="flex-1 py-2.5 text-sm font-medium text-gray-700 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors">Cancel</button>
                    <button type="submit" class="flex-1 py-2.5 text-sm font-medium text-white bg-gray-900 rounded-lg hover:bg-black transition-colors">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const fmtNaira = n => '₦' + Math.trunc(Number(n) || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
        const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

        const CATEGORIES = { food:'Food & Groceries', transport:'Transport', housing:'Housing & Utilities', entertainment:'Entertainment', salary:'Salary', other:'Other' };

        let allTxs = [];

        function renderList(txs) {
            document.getElementById('tx-loading').style.display = 'none';
            const list = document.getElementById('tx-list');
            const empty = document.getElementById('tx-empty');
            list.innerHTML = '';
            if (!txs.length) {
                list.style.display = 'none';
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');
            list.style.display = '';
            for (const t of txs) {
                const color = t.type === 'expense' ? 'red' : 'green';
                const sign  = t.type === 'expense' ? '-' : '+';
                const row = document.createElement('div');
                row.className = 'px-5 py-3.5 flex items-center justify-between';
                row.innerHTML = `
                    <div class="flex items-center gap-3 min-w-0">
                        <div class="w-2 h-2 rounded-full shrink-0 ${color==='green'?'bg-green-500':'bg-red-400'}"></div>
                        <div class="min-w-0">
                            <p class="text-sm font-medium text-gray-900 truncate">${esc(t.note || CATEGORIES[t.category] || t.category || '—')}</p>
                            <p class="text-xs text-gray-400 mt-0.5">${esc(fmtDate(t.date))} · ${esc(CATEGORIES[t.category] || t.category || '')}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3 shrink-0 ml-3">
                        <p class="text-sm font-semibold ${color==='green'?'text-green-600':'text-red-500'}">${sign}${fmtNaira(t.amount)}</p>
                        <button class="edit-tx text-gray-300 hover:text-gray-600 transition-colors" data-id="${t.id}" data-amount="${t.amount}" data-category="${esc(t.category)}" data-note="${esc(t.note)}" data-type="${t.type}" aria-label="Edit">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        </button>
                        <button class="delete-tx text-gray-300 hover:text-red-500 transition-colors" data-id="${t.id}" aria-label="Delete">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                        </button>
                    </div>`;
                list.appendChild(row);
            }
        }

        function updateSummary(txs) {
            const t = txs.reduce((a,t) => { const v=Number(t.amount)||0; t.type==='income'?a.i+=v:a.e+=v; return a; }, {i:0,e:0});
            document.getElementById('income-amount').textContent  = fmtNaira(t.i);
            document.getElementById('expense-amount').textContent = fmtNaira(t.e);
            document.getElementById('balance-amount').textContent = fmtNaira(t.i - t.e);
        }

        async function loadTransactions() {
            const res = await fetch('/api/transactions');
            allTxs = await res.json().catch(() => []);
            document.getElementById('tx-loading').style.display = 'none';
            applyFilter();
            updateSummary(allTxs);
        }

        function applyFilter() {
            const f = document.getElementById('filter').value;
            renderList(f === 'all' ? allTxs : allTxs.filter(t => t.type === f));
        }

        document.getElementById('filter').addEventListener('change', applyFilter);

        // Amount comma formatting
        function formatAmountInput(el) {
            el.addEventListener('input', function() {
                const raw = this.value.replace(/[^0-9]/g, '');
                this.value = raw ? Number(raw).toLocaleString('en-US') : '';
            });
        }
        formatAmountInput(document.getElementById('amount-input'));
        formatAmountInput(document.getElementById('edit-amount'));

        function getRawAmount(el) {
            return el.value.replace(/,/g, '');
        }

        // Add transaction
        document.getElementById('add-tx-form').addEventListener('submit', async e => {
            e.preventDefault();
            const errEl = document.getElementById('tx-error');
            errEl.classList.add('hidden');
            const fd = new FormData(e.currentTarget);
            fd.set('amount', getRawAmount(document.getElementById('amount-input')));
            const res = await fetch('/api/transactions', { method: 'POST', body: fd });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) { errEl.textContent = data.error || 'Failed.'; errEl.classList.remove('hidden'); return; }
            e.currentTarget.reset();
            await loadTransactions();
        });

        // Delete
        document.getElementById('tx-list').addEventListener('click', async e => {
            const btn = e.target.closest('.delete-tx');
            if (!btn) return;
            if (!confirm('Delete this transaction?')) return;
            const res = await fetch('/api/transactions/' + btn.dataset.id, { method: 'DELETE' });
            if (!res.ok) { alert('Delete failed'); return; }
            await loadTransactions();
        });

        // Edit — open modal
        document.getElementById('tx-list').addEventListener('click', e => {
            const btn = e.target.closest('.edit-tx');
            if (!btn) return;
            document.getElementById('edit-id').value       = btn.dataset.id;
            document.getElementById('edit-amount').value   = Number(btn.dataset.amount).toLocaleString('en-US');
            document.getElementById('edit-note').value     = btn.dataset.note;
            document.getElementById('edit-type').value     = btn.dataset.type;
            document.getElementById('edit-category').value = btn.dataset.category || 'other';
            document.getElementById('edit-error').classList.add('hidden');
            document.getElementById('edit-modal').classList.remove('hidden');
        });

        // Edit — close modal
        document.getElementById('edit-cancel').addEventListener('click', () => document.getElementById('edit-modal').classList.add('hidden'));
        document.getElementById('edit-modal').addEventListener('click', e => { if (e.target === document.getElementById('edit-modal')) document.getElementById('edit-modal').classList.add('hidden'); });

        // Edit — submit
        document.getElementById('edit-tx-form').addEventListener('submit', async e => {
            e.preventDefault();
            const errEl = document.getElementById('edit-error');
            errEl.classList.add('hidden');
            const id = document.getElementById('edit-id').value;
            const fd = new FormData(e.currentTarget);
            fd.set('amount', getRawAmount(document.getElementById('edit-amount')));
            const res = await fetch('/api/transactions/' + id, { method: 'PUT', body: fd });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) { errEl.textContent = data.error || 'Update failed.'; errEl.classList.remove('hidden'); return; }
            document.getElementById('edit-modal').classList.add('hidden');
            await loadTransactions();
        });

        // Logout
        document.getElementById('logout-link').addEventListener('click', e => { e.preventDefault(); window.location.href = '/api/logout'; });

        loadTransactions();
    </script>
</body>
</html>
